# One-click deploy on Render (render.com -> New -> Blueprint -> pick this repo).
# Free tier sleeps when idle and has an ephemeral disk: run history resets on redeploy (fine for a demo).
services:
  - type: web
    name: ap-autopilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    branch: main
    autoDeploy: true   # every push to main rebuilds and redeploys
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # paste your key in the Render dashboard; never commit it
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: EXTRACTION_MODE
        value: auto
      - key: DEMO_SEED
        value: "few"   # empty DB on boot -> process 6 starter invoices so the dashboard and review queue open with data ("all" = every sample, "off" = none)
      - key: ANTHROPIC_API_KEY
        sync: false   # optional: paste a key in the Render dashboard to enable Claude extraction
